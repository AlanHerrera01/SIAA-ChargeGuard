<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="cgShieldGrad" x1="6" y1="4" x2="42" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="cgCheckGrad" x1="16" y1="20" x2="32" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ECFDF5"/>
      <stop offset="100%" stop-color="#D1FAE5"/>
    </linearGradient>
    <filter id="cgShadow" x="0" y="2" width="48" height="46" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#047857" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Shield Base -->
  <path d="M24 4L8 10V22C8 32.5 14.8 42.2 24 44C33.2 42.2 40 32.5 40 22V10L24 4Z" 
        fill="url(#cgShieldGrad)" 
        filter="url(#cgShadow)"/>

  <!-- Inner Subtle Border -->
  <path d="M24 6.5L10 11.8V22C10 31.2 16 39.8 24 41.5C32 39.8 38 31.2 38 22V11.8L24 6.5Z" 
        stroke="#34D399" 
        stroke-opacity="0.4" 
        stroke-width="1.5" 
        fill="none"/>

  <!-- Shield Core Accent Ring -->
  <path d="M24 12V36" stroke="#A7F3D0" stroke-width="1" stroke-dasharray="2 3" stroke-opacity="0.4"/>

  <!-- Currency / Protection Checkmark -->
  <path d="M16 23.5L21.5 29L32 18" 
        stroke="url(#cgCheckGrad)" 
        stroke-width="4" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
</svg>
