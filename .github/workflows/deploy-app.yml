name: Deploy Application

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'agents/**'
      - 'frontend/**'
      - '.github/workflows/deploy-app.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-app
  cancel-in-progress: false

jobs:
  filter:
    name: Detect App Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'agents/**'
              - '.github/workflows/deploy-app.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/deploy-app.yml'

  deploy-backend:
    name: Build & Deploy Backend Lambda
    needs: filter
    if: ${{ needs.filter.outputs.backend == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          audience: sts.amazonaws.com

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Package and Deploy Backend Lambda
        run: |
          python scripts/package_lambdas.py --component backend --upload

  deploy-frontend:
    name: Build & Deploy Frontend to Amplify
    needs: filter
    if: ${{ needs.filter.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          audience: sts.amazonaws.com

      - name: Build and Deploy to Amplify
        env:
          AMPLIFY_APP_ID: ${{ vars.AMPLIFY_APP_ID }}
          VITE_BACKEND_API_URL: ${{ vars.API_GATEWAY_URL }}
          VITE_MOCK_BANK_API_URL: ${{ vars.API_GATEWAY_URL }}/mock/bank
          VITE_MOCK_MERCHANT_API_URL: ${{ vars.API_GATEWAY_URL }}/mock/merchant
          VITE_CHARGEGUARD_DATA_SOURCE: api
          VITE_DEMO_USER_ID: usr_demo
        run: |
          set -euo pipefail
          if [ -z "$AMPLIFY_APP_ID" ]; then
            echo "::error::vars.AMPLIFY_APP_ID is not configured in repository variables."
            exit 1
          fi

          echo "Building frontend with Vite..."
          cd frontend
          npm ci
          npm run build

          echo "Packaging frontend distribution..."
          cd dist
          zip -qr ../frontend_dist.zip .
          cd ..

          echo "Creating Amplify deployment..."
          DEPLOY_INFO=$(aws amplify create-deployment --app-id "$AMPLIFY_APP_ID" --branch-name main --no-cli-pager)
          UPLOAD_URL=$(echo "$DEPLOY_INFO" | jq -r .zipUploadUrl)
          JOB_ID=$(echo "$DEPLOY_INFO" | jq -r .jobId)

          echo "Uploading zip artifact to Amplify upload URL..."
          curl -sS -T frontend_dist.zip "$UPLOAD_URL"

          echo "Starting Amplify deployment (jobId=$JOB_ID)..."
          aws amplify start-deployment --app-id "$AMPLIFY_APP_ID" --branch-name main --job-id "$JOB_ID" --no-cli-pager
          echo "Amplify deployment initiated successfully."
