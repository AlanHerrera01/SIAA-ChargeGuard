name: Deploy Infrastructure

on:
  push:
    branches:
      - main
    paths:
      - 'infrastructure/**'
      - '.github/workflows/deploy-infra.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-infra
  cancel-in-progress: false

jobs:
  deploy:
    name: Terraform Plan & Apply (Production)
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Deployment Prerequisites
        run: |
          echo "Checking deployment prerequisites..."
          if [ ! -f "infrastructure/backend.hcl" ]; then
            echo "::error::Remote backend configuration file 'infrastructure/backend.hcl' not found!"
            echo "::error::Running apply with a local backend in CI/CD is strictly prohibited. State would be lost upon runner termination, causing orphaned AWS resources."
            echo "::error::Execute the initial bootstrap and provide infrastructure/backend.hcl before triggering CI deployments."
            exit 1
          fi
          echo "Backend prerequisite verified successfully."

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          audience: sts.amazonaws.com

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.5'

      - name: Terraform Init
        run: |
          terraform -chdir=infrastructure init -backend-config=backend.hcl

      - name: Terraform Plan
        run: |
          terraform -chdir=infrastructure plan \
            -var="github_repo=${{ github.repository }}" \
            -var="github_repo_oidc_subject=${{ vars.AWS_OIDC_SUBJECT || 'AlanHerrera01@107574787/SIAA-ChargeGuard@1356601608' }}" \
            -out=tfplan

      - name: Terraform Apply
        run: |
          terraform -chdir=infrastructure apply -auto-approve tfplan
