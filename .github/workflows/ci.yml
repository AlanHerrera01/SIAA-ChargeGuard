name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      python: ${{ steps.filter.outputs.python }}
      terraform: ${{ steps.filter.outputs.terraform }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            python:
              - 'datasets/**'
              - 'mock-services/**'
              - 'scripts/**'
              - 'pyproject.toml'
              - 'requirements*.txt'
              - '.github/workflows/ci.yml'
            terraform:
              - 'infrastructure/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'

  lint-test-python:
    name: Lint & Test Python
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            datasets/requirements.txt
            mock-services/bank/requirements*.txt
            mock-services/merchant/requirements*.txt
            scripts/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            -r datasets/requirements.txt \
            -r mock-services/bank/requirements-dev.txt \
            -r mock-services/merchant/requirements-dev.txt \
            -r scripts/requirements-dev.txt

      - name: Ruff check & format check
        run: |
          ruff check datasets mock-services scripts
          ruff format --check datasets mock-services scripts

      - name: Run pytest test suite
        run: |
          pytest datasets mock-services/bank mock-services/merchant scripts -m "not localstack"

  terraform:
    name: Terraform Validate
    needs: changes
    if: ${{ needs.changes.outputs.terraform == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.5'

      - name: Check Terraform formatting
        run: |
          terraform fmt -check -recursive infrastructure

      - name: Validate Bootstrap configuration
        run: |
          terraform -chdir=infrastructure/bootstrap init -backend=false
          terraform -chdir=infrastructure/bootstrap validate

      - name: Validate Root configuration
        run: |
          terraform -chdir=infrastructure init -backend=false
          terraform -chdir=infrastructure validate

  frontend:
    name: Frontend Build
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check and build frontend
        run: |
          if [ -f "frontend/package.json" ]; then
            echo "frontend/package.json found. Installing and building..."
            cd frontend
            npm ci
            npm run build
          else
            echo "frontend/package.json does not exist yet; skipping build cleanly."
          fi
